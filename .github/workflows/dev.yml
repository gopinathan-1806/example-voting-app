name: CI - Dev

on:
  push:
    branches: [ dev ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, vote, result, worker]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: voting-app-${{ matrix.service }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="dev-${SHORT_SHA}"

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./${{ matrix.service }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Checkout voting-infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/voting-infra
          token: ${{ secrets.GITOPS_TOKEN }}
          path: voting-infra

      - name: Update ArgoCD manifest and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: voting-app-${{ matrix.service }}
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="dev-${SHORT_SHA}"

          cd voting-infra

          if [ "${{ matrix.service }}" = "worker" ]; then
            FILE_EXT="-deployment.yaml"
          else
            FILE_EXT="-rollout.yaml"
          fi

          # Update the image tag in the deployment manifest
          sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s-manifests/dev/${{ matrix.service }}${FILE_EXT}

          # Commit and push the changes
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s-manifests/dev/${{ matrix.service }}${FILE_EXT}
          git commit -m "Update ${{ matrix.service }} image tag to $IMAGE_TAG"
          git push
